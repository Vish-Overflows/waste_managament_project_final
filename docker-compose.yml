version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: waste_management
      POSTGRES_USER: waste_admin
      POSTGRES_PASSWORD: waste_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waste_admin -d waste_management"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://waste_admin:waste_password@postgres:5432/waste_management
      SECRET_KEY: replace-this-in-production
      SECURE_COOKIES: "false"
      WEB_CONCURRENCY: 2
      CORS_ORIGINS: http://localhost,http://127.0.0.1
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
